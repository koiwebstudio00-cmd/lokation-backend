# Compose opcional para levantar solo Postgres en desarrollo. La API corre con
# `npm run dev`; producción usa la imagen del Dockerfile desplegada por Dokploy.

name: ubikka

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ubikka_dev
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ubikka_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
